# macOS .dmg for this fork: the release's own build script
# (tools/installer/build-macos.sh), cut to the one processor target each runner
# is, so it finishes in one pass. Everything else is the release build: Xcode's
# tools, the Safari extension (swiftc), pwsh for the browser extension, ad-hoc
# signing, and a ULMO .dmg.
#
# Three runners, because GitHub's macOS arm64 capacity comes and goes ("The job
# was not acquired by Runner of type hosted"): the first Apple Silicon one that
# gets a machine builds the .dmg this Mac wants; the Intel one is the fallback
# (it runs on Apple Silicon through Rosetta).
name: macOS dmg

on:
  workflow_dispatch:
  push:
    branches: ["fix/macos-external-disk"]

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin:arm64
          - runner: macos-14
            target: aarch64-apple-darwin:arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin:x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: .dmg (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ github.token }} # the build's helpers, fetched from the release
        run: |
          sed -i '' "s|^targets=.*|targets=(${{ matrix.target }})|" tools/installer/build-macos.sh
          bash tools/installer/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mdm-dmg-${{ matrix.runner }}
          path: target/dist/*.dmg
          if-no-files-found: error
